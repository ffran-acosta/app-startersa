openapi: 3.1.0
info:
  title: Arquitecturas starter API
  version: 1.0.0
  description: |
    Contrato único que implementan todos los backends `nest-*`.

    - Recursos sueltos se devuelven sin envoltorio.
    - Listados paginados: `{ data, meta }`.
    - Todo error responde con el schema `Error`.
    - Un `USER` solo accede a sus todos; uno ajeno responde `404`. `ADMIN` accede a todos.

servers:
  - url: http://localhost:3001
    description: nest-layered
  - url: http://localhost:3002
    description: nest-hexagonal
  - url: http://localhost:3003
    description: nest-ddd-cqrs
  - url: http://localhost:3004
    description: nest-modular-monolith
  - url: http://localhost:3005
    description: nest-microservices (gateway)
  - url: http://localhost:3006
    description: nest-event-driven

tags:
  - name: auth
  - name: todos

security:
  - bearerAuth: []

paths:
  /auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: Registrar usuario
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Usuario creado (rol `USER`) y sesión iniciada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/Conflict'

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Iniciar sesión
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Sesión iniciada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/refresh:
    post:
      tags: [auth]
      operationId: refresh
      summary: Renovar tokens
      security: []
      description: Rota el par de tokens; el refresh token usado queda invalidado.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Nuevo par de tokens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Cerrar sesión
      security: []
      description: Invalida el refresh token. Idempotente; un token desconocido o ya invalidado también responde `204`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          description: Sesión cerrada.
        '400':
          $ref: '#/components/responses/ValidationError'

  /auth/me:
    get:
      tags: [auth]
      operationId: me
      summary: Usuario actual
      responses:
        '200':
          description: Usuario autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /todos:
    get:
      tags: [todos]
      operationId: listTodos
      summary: Listar todos
      description: Ordenado por `createdAt` descendente.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/TodoStatus'
        - name: search
          in: query
          description: Búsqueda case-insensitive sobre `title` y `description`.
          schema:
            type: string
            minLength: 1
            maxLength: 100
      responses:
        '200':
          description: Página de todos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodoPage'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [todos]
      operationId: createTodo
      summary: Crear todo
      description: El `ownerId` es siempre el usuario autenticado.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTodoRequest'
      responses:
        '201':
          description: Todo creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /todos/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [todos]
      operationId: getTodo
      summary: Obtener todo
      responses:
        '200':
          description: Todo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [todos]
      operationId: updateTodo
      summary: Actualizar todo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTodoRequest'
      responses:
        '200':
          description: Todo actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [todos]
      operationId: deleteTodo
      summary: Eliminar todo
      responses:
        '204':
          description: Todo eliminado.
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Role:
      type: string
      enum: [USER, ADMIN]

    TodoStatus:
      type: string
      enum: [PENDING, DONE]

    User:
      type: object
      additionalProperties: false
      required: [id, email, name, role, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password, name]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 72
        name:
          type: string
          minLength: 1
          maxLength: 100

    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1

    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    TokenPair:
      type: object
      additionalProperties: false
      required: [accessToken, refreshToken, expiresIn]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
          description: Vida del access token en segundos.

    AuthResponse:
      allOf:
        - $ref: '#/components/schemas/TokenPair'
        - type: object
          required: [user]
          properties:
            user:
              $ref: '#/components/schemas/User'

    Todo:
      type: object
      additionalProperties: false
      required: [id, title, description, status, dueDate, ownerId, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: [string, 'null']
        status:
          $ref: '#/components/schemas/TodoStatus'
        dueDate:
          type: [string, 'null']
          format: date-time
        ownerId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateTodoRequest:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: [string, 'null']
          maxLength: 2000
        status:
          $ref: '#/components/schemas/TodoStatus'
          default: PENDING
        dueDate:
          type: [string, 'null']
          format: date-time

    UpdateTodoRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Parcial. `null` en `description` o `dueDate` los borra.
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: [string, 'null']
          maxLength: 2000
        status:
          $ref: '#/components/schemas/TodoStatus'
        dueDate:
          type: [string, 'null']
          format: date-time

    PageMeta:
      type: object
      additionalProperties: false
      required: [page, limit, total, totalPages]
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer

    TodoPage:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Todo'
        meta:
          $ref: '#/components/schemas/PageMeta'

    ErrorCode:
      type: string
      enum:
        - VALIDATION_ERROR
        - UNAUTHORIZED
        - FORBIDDEN
        - NOT_FOUND
        - CONFLICT
        - INTERNAL_ERROR

    Error:
      type: object
      additionalProperties: false
      required: [statusCode, error, message, path, timestamp]
      properties:
        statusCode:
          type: integer
        error:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
        details:
          type: array
          description: Solo en `VALIDATION_ERROR`.
          items:
            type: object
            additionalProperties: false
            required: [field, message]
            properties:
              field:
                type: string
              message:
                type: string
        path:
          type: string
        timestamp:
          type: string
          format: date-time

  responses:
    ValidationError:
      description: Request inválido.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            statusCode: 400
            error: VALIDATION_ERROR
            message: Validation failed
            details:
              - field: title
                message: title must be shorter than or equal to 200 characters
            path: /todos
            timestamp: '2026-01-01T00:00:00.000Z'
    Unauthorized:
      description: Falta token, es inválido/expirado, o credenciales incorrectas.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: No existe o no pertenece al usuario.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: El email ya está registrado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
