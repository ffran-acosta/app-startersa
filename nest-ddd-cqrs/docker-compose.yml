services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nest_ddd_cqrs
    ports:
      - '5403:5432'
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d nest_ddd_cqrs']
      interval: 2s
      timeout: 5s
      retries: 15

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/nest_ddd_cqrs
    ports:
      - '3003:3003'
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
